apiVersion: v1
kind: ConfigMap
metadata:
  name: esgame-config
data:
  # Public calculation URL the browser posts to. The host must be the esgame-calculation-ingress
  # host in kustomization.yaml — this is where the browser POSTs, so a host no Ingress here
  # serves means the round fails in the browser and nowhere else. It said "must match" and did
  # not: it pointed at esgame-calculation.containers.wurnet.nl, a host belonging to a different
  # deployment. test/k8s.sh now compares the two.
  #
  # Include the port if the ingress is not on 443/80. A browser cannot infer it, and a portless
  # URL sends the POST to 443 where nothing may be listening.
  CALC_URL: "https://change-me-places-calculation.example.com/esgame"
  # Server-to-server: the calculation publishes coverages over GeoServer's REST API from inside
  # the cluster.
  GEOSERVER_URL: "http://esgame-geoserver-service:8080/geoserver"
  # Browser-facing: the WCS URLs the calculation hands back. This has to be the geoserver INGRESS
  # host, not the service name above — the browser cannot resolve esgame-geoserver-service, so
  # leaving these equal yields coverage URLs no client can fetch. Keep in step with the
  # esgame-geoserver-ingress host in kustomization.yaml.
  GEOSERVER_PUBLIC_URL: "https://change-me-places-geoserver.example.com/geoserver"
