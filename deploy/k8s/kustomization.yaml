apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Consume the esgame Kubernetes base (frontend + calculation + geoserver) and layer ONLY the
# places-specific bits on top — no forked manifests.
# Pin the ref to v2.0.0 once that esgame release is tagged (master is used until then; 1.9.0
# predates deploy/k8s/base).
resources:
  # ROLLING REF. `?ref=master` means this overlay renders against whatever esgame master is at
  # the moment you run it — two `kubectl apply -k` a week apart are not the same deployment, and
  # an upstream change lands here with no gate. That is the same class of thing test/k8s.sh
  # forbids for the GeoServer image ("GeoServer is not a rolling tag").
  #
  # It is deliberate for now: places tracks esgame closely and wants base fixes immediately.
  # Pin it to a commit for a deployment you need to reproduce:
  #   ...esgame//deploy/k8s/base?ref=<sha>
  # and re-run test/k8s.sh after each bump.
  - https://github.com/mlacayoemery/esgame//deploy/k8s/base?ref=master
  - pvc.yaml

# Repoint the base's images at the places images.
#
# These key on the image the esgame base has ALREADY rewritten its logical names to, not on
# the logical names themselves. Kustomize applies the base's own `images:` transformer first,
# so by the time this overlay runs `esgame-angular` no longer appears anywhere — an entry
# keyed on it matches nothing, does not warn, and leaves the upstream esgame image deployed.
# Confirm with: kustomize build deploy/k8s | grep 'image:'
images:
  - name: ghcr.io/mlacayoemery/esgame
    newName: CHANGE-ME-registry/places-frontend      # built from ../../frontend
    newTag: latest
  - name: ghcr.io/mlacayoemery/esgame-calculation
    newName: CHANGE-ME-registry/places-calculation    # built from ../../calculation
    newTag: latest

patches:
  # places' backend URL + geoserver (overrides the base ConfigMap).
  - path: patch-config.yaml
  # places geodata: swap the base's emptyDir for a PVC + a loader init container.
  - path: patch-calculation.yaml
  # Ingress hosts (replace the placeholder hosts in the base).
  - target: { kind: Ingress, name: esgame-angular-ingress }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: change-me-places.example.com
  - target: { kind: Ingress, name: esgame-calculation-ingress }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: change-me-places-calculation.example.com
  - target: { kind: Ingress, name: esgame-geoserver-ingress }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: change-me-places-geoserver.example.com
