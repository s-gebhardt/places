apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Consume the esgame Kubernetes base (frontend + calculation + geoserver) and layer ONLY the
# places-specific bits on top — no forked manifests.
resources:
  # PINNED to an esgame commit (master on 2026-09-25). It was `?ref=master`, which rendered
  # against whatever master was at the moment you ran it: two `kubectl apply -k` a week apart
  # were not the same deployment, and an upstream change landed here with no gate. It had
  # already happened by the time this was pinned — master had moved GeoServer to its own
  # esgame-geoserver image and test/k8s.sh failed with nobody here touching anything.
  #
  # Bumping is deliberate now. Preview what master would do first — the daily CI run does the
  # same, so upstream breakage still shows up early, just not in a deployment:
  #   ESGAME_REF=master test/k8s.sh
  # then change the sha here, re-pin the GeoServer tag below if the base's image moved, and
  # re-run test/k8s.sh. Move to v2.0.0 once that esgame release is tagged.
  - https://github.com/mlacayoemery/esgame//deploy/k8s/base?ref=d5438c1ae3ff72eb6c4a2dacaa2915ee4fe1b6c0
  - pvc.yaml

# Repoint the base's images at the places images, and pin the one image we still take from it.
#
# These key on the image the esgame base has ALREADY rewritten its logical names to, not on
# the logical names themselves. Kustomize applies the base's own `images:` transformer first,
# so by the time this overlay runs `esgame-angular` no longer appears anywhere — an entry
# keyed on it matches nothing, does not warn, and leaves the upstream esgame image deployed.
# Confirm with: kustomize build deploy/k8s | grep 'image:'
images:
  # Published by .github/workflows/image-frontend.yml and image-calculation.yml. `main` is the
  # rolling tag those push from the main branch — like the base's own `master`. A deployment
  # you need to reproduce pins the sha-<commit> tag instead, in its own overlay.
  - name: ghcr.io/mlacayoemery/esgame
    newName: ghcr.io/s-gebhardt/places-frontend      # built from ../../frontend
    newTag: main
  - name: ghcr.io/mlacayoemery/esgame-calculation
    newName: ghcr.io/s-gebhardt/places-calculation    # built from ../../calculation
    newTag: main
  # The base names GeoServer by esgame's ROLLING `:master` tag, with imagePullPolicy: Always —
  # so pinning the ref above pinned the manifest but not the GeoServer it deploys. sha-afe26c1
  # is the tag whose digest master carried on 2026-09-25
  # (sha256:8a5df0e75cb6962531b4a0f183570eb4da3983ea037070b3340fe29d755c9dfd).
  - name: ghcr.io/mlacayoemery/esgame-geoserver
    newTag: sha-afe26c1

patches:
  # places' backend URL + geoserver (overrides the base ConfigMap).
  - path: patch-config.yaml
  # places geodata: swap the base's emptyDir for a PVC + a loader init container.
  - path: patch-calculation.yaml
  # Ingress hosts (replace the placeholder hosts in the base).
  - target: { kind: Ingress, name: esgame-angular-ingress }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: change-me-places.example.com
  - target: { kind: Ingress, name: esgame-calculation-ingress }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: change-me-places-calculation.example.com
  - target: { kind: Ingress, name: esgame-geoserver-ingress }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: change-me-places-geoserver.example.com
