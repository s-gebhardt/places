name: Validate the esgame overlay

# PLACES is a thin overlay on esgame. Both halves of it are PINNED to an esgame build now:
# deploy/k8s pulls the base at a commit, and frontend/Dockerfile builds FROM an esgame sha- tag.
# They used to track esgame master, which meant this repository could break without anyone
# touching it — and it did: master moved GeoServer to its own image and test/k8s.sh went red.
#
# The pins make what we deploy reproducible; they do not make upstream stop moving. So the daily
# run keeps a second purpose: the upstream-master job re-runs both overlay tests against esgame
# MASTER, which is the early warning that the next bump will need work. A red upstream-master
# with a green k8s-overlay/frontend-overlay means "do not bump yet", not "production is broken".
#
# Deliberately excluded: test/stack.sh. It needs the geodata cache and a ~15 minute R image
# build, which is not a sensible thing to run on every push. Run it by hand — see the README.
#
# calculation/ was excluded too, which meant a syntax error in calculation.r surfaced only when
# someone built that image and ran the stack. Building it in CI is still not sensible; PARSING
# it is nearly free, so that is what the r-syntax job does. (image-calculation.yml does build it,
# but only to publish, on main.)

on:
  push:
    branches: ['**']
    paths: ['deploy/**', 'frontend/**', 'test/**', 'calculation/**', '.github/workflows/overlay.yml']
  pull_request:
    paths: ['deploy/**', 'frontend/**', 'test/**', 'calculation/**', '.github/workflows/overlay.yml']
  schedule:
    # 05:40 UTC. Off the hour on purpose: scheduled jobs landing exactly on :00 queue behind
    # everyone else's. Runs every job below, pinned and upstream-master alike.
    - cron: '40 5 * * *'
  workflow_dispatch:

jobs:
  k8s-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kustomize and kubeconform
        run: |
          curl -sSfL -o kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          curl -sSfL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kustomize kubeconform /usr/local/bin/

      - name: Render and check the overlay
        run: test/k8s.sh

  frontend-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the thin image on the pinned esgame base and check what it serves
        run: test/smoke.sh

  upstream-master:
    # The early warning the pins would otherwise have taken away: both overlay tests, against
    # esgame master instead of the pinned build. Scheduled and manual only — on a push it would
    # make this repository's CI fail for upstream's changes, which is what the pins are for.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kustomize and kubeconform
        run: |
          curl -sSfL -o kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          curl -sSfL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kustomize kubeconform /usr/local/bin/

      - name: The overlays on the esgame base at master
        run: ESGAME_REF=master test/k8s.sh

      - name: The thin image on the esgame image at master
        run: ESGAME_IMAGE=ghcr.io/mlacayoemery/esgame:master test/smoke.sh

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Parsing is not running: this catches a syntax error, not a wrong reclassify. That is the
      # right trade — the alternative was no gate at all on calculation/, because the image takes
      # ~15 minutes to build and CI has no geodata to run it against.
      # install-r must stay true: ubuntu-latest has no R, and `install-r: false` tells setup-r
      # to use a pre-installed one — which gave "Rscript: command not found" and exit 127.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: calculation.r must parse
        run: |
          set -euo pipefail
          # Presence first: a renamed file would otherwise make this pass by checking nothing.
          test -f calculation/calculation.r \
            || { echo "::error::calculation/calculation.r is missing; this check covers nothing"; exit 1; }
          Rscript -e 'invisible(parse("calculation/calculation.r")); cat("calculation.r parses\n")'

      - name: The coverage reporter must be right, not merely parseable
        run: |
          set -euo pipefail
          # Parsing is not running, and the step above says so. This runs the one piece of R that
          # decides whether a round was SCORED or IGNORED — a failure that is silent by
          # construction, since reclassify() drops ids it does not recognise without a word and
          # the round returns 200 with finite scores either way.
          #
          # Base R, no testthat, no raster, no GDAL, so this job installs nothing beyond R.
          # Mirrors mlacayoemery/esgame#179; coverage.R is byte-identical to that repository's.
          test -f calculation/test-coverage.R \
            || { echo "::error::calculation/test-coverage.R is missing; the R behaviour is ungated again"; exit 1; }
          Rscript calculation/test-coverage.R
