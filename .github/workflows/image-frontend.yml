name: Publish the frontend image

# Publishes places-frontend to GitHub Container Registry, so a cluster can pull it. Building on the
# node is not an option: the esgame base sets imagePullPolicy: Always, so the kubelet asks a
# registry at every pod start and an image imported onto the node is not enough.
#
# Image: ghcr.io/<owner>/places-frontend   tags: sha-<commit> (immutable; what deployments pin),
# the branch (`main`, rolling), and the version on a v* tag.
#
# PUBLIC, so a cluster pulls it without credentials. A package this workflow creates is linked to
# the repository and took its public visibility — measured on the first publish (2026-09-25): an
# anonymous pull of the sha- tag returned 200. If the repository or a package is ever made private,
# a cluster without registry credentials gets ErrImagePull.
#
# Kept apart from image-calculation.yml, as esgame keeps its two apart: different trigger paths,
# and ~1 minute against ~15, so one would make every frontend publish look slow.

on:
  push:
    # feature/esgame-overlay is TEMPORARY: images are needed before that branch reaches main, and
    # workflow_dispatch only works once a workflow is on the default branch. Drop it after the merge.
    branches: [main, feature/esgame-overlay]
    tags: ['v*']
    paths:
      - 'frontend/**'
      - '.github/workflows/image-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/places-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v7
        id: build
        with:
          # FROM the esgame image pinned in frontend/Dockerfile — no build-arg, so the published
          # image is built on exactly the base test/smoke.sh tests by default.
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: The published image must serve PLACES
        # A push proves bytes were uploaded, not that they are PLACES. This pulls the sha- tag —
        # the one a deployment pins — and runs the same checks test/smoke.sh runs on a local
        # build: CALC_URL injected, PLACES' data.json and map rasters served, uid 101.
        run: |
          set -euo pipefail
          tag=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | grep ':sha-' | head -1)
          [ -n "${tag}" ] || { echo "::error::no sha- tag among: ${{ steps.meta.outputs.tags }}"; exit 1; }
          PLACES_FRONTEND_IMAGE="${tag}" test/smoke.sh

      - name: Say what was published
        run: |
          tag=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | grep ':sha-' | head -1)
          {
            echo "### Published"
            echo
            echo '```'
            printf '%s\n' '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "To deploy it, pin places-frontend in the deployment's overlay with \`newTag: ${tag##*:}\`."
          } >> "$GITHUB_STEP_SUMMARY"
